name: "Confect Packages Setup"
description: "Sets up Node.js and pnpm for the confect packages"
author: "Confect"

runs:
  using: "composite"
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: ".node-version"
        cache: "pnpm"

    - uses: ./.github/actions/bun-setup

    - name: Install dependencies
      run: pnpm install
      shell: bash

    - name: Build Confect packages
      run: pnpm build
      shell: bash
