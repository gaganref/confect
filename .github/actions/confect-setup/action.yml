name: "Confect Packages Setup"
description: "Sets up Node.js and pnpm for the confect packages"
author: "Confect"

inputs:
  build:
    description: "Build package distributions after installing dependencies"
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: ".node-version"
        cache: "pnpm"

    - uses: ./.github/actions/bun-setup

    - name: Install dependencies
      run: pnpm install
      shell: bash

    - name: Build Confect packages
      if: inputs.build == 'true'
      run: pnpm build
      shell: bash
