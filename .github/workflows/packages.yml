name: Packages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      n:
        description: Unused fork build number above all existing builds. Leave empty for the next number.
        required: false
        type: string

jobs:
  test-scripts:
    name: Test (scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/confect-setup
      - run: bun test ./scripts

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/confect-setup
      - run: pnpm format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/confect-setup
      - run: pnpm typecheck
      - run: pnpm typecheck:inexact

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/confect-setup
      - run: pnpm lint

  circular:
    name: Circular dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/confect-setup
      - run: pnpm circular

  test:
    name: Test (${{ matrix.package }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        package: [alchemy, cli, core, foldkit, js, server, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/confect-setup
      - run: cd packages/${{ matrix.package }} && pnpm test

  test-oxlint-rules:
    name: Test (oxlint-rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/confect-setup
      - run: pnpm exec vitest run --project confect-oxlint-rules

  test-mock-backend:
    name: Test (mock-backend, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/confect-setup
      - run: pnpm --filter @confect/server test:mock-backend

  test-local-backend:
    name: Test (local-backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/confect-setup
      - name: Cache convex local-backend binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/convex/binaries
          key: convex-local-backend-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            convex-local-backend-${{ runner.os }}-
      - run: pnpm --filter @confect/server test:local-backend

  codegen-fixtures:
    name: Codegen (server fixtures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/confect-setup
      - name: Cache convex local-backend binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/convex/binaries
          key: convex-local-backend-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            convex-local-backend-${{ runner.os }}-
      - run: pnpm codegen:server:mock-backend
      - run: pnpm codegen:server:local-backend
      - uses: ./.github/actions/verify-codegen-committed
        with:
          path: packages/server/test

  bench:
    name: Bench
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: ["@confect/core", "@confect/server"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/confect-setup
      - run: pnpm --filter ${{ matrix.package }} bench

  pack-contents:
    name: Pack contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/confect-setup
      - run: pnpm build
      - run: pnpm check:pack-contents

  packed-consumers:
    name: Packed React app (${{ matrix.manager }}, ${{ matrix.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        manager: [npm, pnpm]
        lane: [baseline, fresh]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/confect-setup
      - run: pnpm check:consumers --profile react --lane ${{ matrix.lane }} --manager ${{ matrix.manager }} --report ${{ runner.temp }}/consumer-result.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: consumer-react-${{ matrix.manager }}-${{ matrix.lane }}
          path: ${{ runner.temp }}/consumer-result.json
          if-no-files-found: error

  build:
    name: Build (${{ matrix.package }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        package:
          [
            "@confect/alchemy",
            "@confect/cli",
            "@confect/core",
            "@confect/foldkit",
            "@confect/js",
            "@confect/server",
            "@confect/react",
            "@confect/test",
          ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/confect-setup
      - run: pnpm exec vp run --filter ${{ matrix.package }} build

  publish:
    name: Publish checked fork build
    needs:
      - test-scripts
      - format
      - typecheck
      - lint
      - circular
      - test
      - test-oxlint-rules
      - test-mock-backend
      - test-local-backend
      - codegen-fixtures
      - bench
      - pack-contents
      - packed-consumers
      - build
    if: github.repository == 'gaganref/confect' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish.yml
    with:
      publish: true
      n: ${{ inputs.n || '' }}
